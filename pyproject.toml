[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bilidown"
version = "2.0.0"
description = "Amedown —— Bilibili 视频/音频下载器（Tkinter 桌面客户端）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bilibili-api-python>=17.4.1",
    "moviepy>=2.0",
    "Pillow>=10.0",
    "pyperclip>=1.8",
    "requests>=2.31",
    "pywinstyles>=1.6; sys_platform == 'win32'",
    "sv-ttk>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[project.gui-scripts]
bilidown = "bilidown.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bilidown = ["resources/*.jpg", "resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 60

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/bilidown/ui/*" = ["B008"]
